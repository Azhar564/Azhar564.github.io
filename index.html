<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Azhar Ramadhan Halim — Portfolio</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="cursor"></div>
  <div id="cursor-ring"></div>

  <div id="canvas-container"><canvas id="three-canvas"></canvas></div>
  <canvas id="particles"></canvas>

  <div id="header">
    <div>
      <h1>AZHAR RAMADHAN HALIM</h1>
      <span>C# & Unity Game Programmer</span>
    </div>
    <div style="text-align:right; font-size:0.72rem; color:var(--muted); letter-spacing:0.15em;">
      JAKARTA, ID<br>
      <span style="color:var(--glow)">●</span> AVAILABLE
    </div>
  </div>

  <div id="center-ui">
    <div class="hero-image">
      <img src="./assets/images/photo.png" />
    </div>
    <div class="hero-title">AZHAR RAMADHAN HALIM</div>
    <div class="hero-sub">C# · Unity · VR · WebGL · Android</div>
    <div class="water-buttons">
      <button class="water-btn" id="btn-resume" onclick="openPanel('resume')">
        <canvas id="wave-resume"></canvas>
        <div class="water-btn-label">
          <span class="icon">📄</span>
          <span class="label-text">RESUME</span>
          <span class="label-sub">Experience</span>
        </div>
      </button>
      <button class="water-btn" id="btn-portfolio" onclick="openPanel('portfolio')">
        <canvas id="wave-portfolio"></canvas>
        <div class="water-btn-label">
          <span class="icon">🎮</span>
          <span class="label-text">PORTFOLIO</span>
          <span class="label-sub">Projects</span>
        </div>
      </button>
    </div>
  </div>

  <div id="splash-overlay">
    <canvas id="splash-canvas"></canvas>
  </div>

  <div id="panel">
    <div class="panel-backdrop" onclick="closePanel()"></div>
    <div class="panel-container">
      <div class="panel-wave"></div>
      <div class="panel-header">
        <div class="panel-title" id="panel-title">Resume</div>
        <button class="panel-close" onclick="closePanel()">✕</button>
      </div>
      <div class="panel-body" id="panel-body"></div>
    </div>
  </div>

  <!-- External Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="script.js"></script>

</body>

</html>
